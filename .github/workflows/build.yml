name: Build Executables

on:
  push:
    branches: [ master, development ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          # Exclude arm64 for Windows as it's less common
          - goos: windows
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        # Set output filename based on OS
        if [ "$GOOS" = "windows" ]; then
          OUTPUT_NAME="seapower-calculator-$GOOS-$GOARCH.exe"
        else
          OUTPUT_NAME="seapower-calculator-$GOOS-$GOARCH"
        fi

        # Build the binary
        go build -v -trimpath -ldflags="-s -w" -o "$OUTPUT_NAME" ./main.go

        # Verify the build
        ls -lh "$OUTPUT_NAME"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: seapower-calculator-${{ matrix.goos }}-${{ matrix.goarch }}
        path: seapower-calculator-*
        retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
